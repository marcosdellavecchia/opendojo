// The test server: the Open Dojo pack only, off the public server
// lists (dedicated 1, set by test-server.sh), on its own port.

seta sv_hostname "Open Dojo test"
seta sv_maxclients 8
seta g_motd "Open Dojo: free multiplayer test server"
set sv_welcome "Welcome to the Open Dojo test server"
seta sv_fps 30
seta g_inactivity 0

seta g_gametype 0
seta fraglimit 0
seta timelimit 0

// team names shown by the game code (its defaults are Empire and Rebellion)
seta g_redteam "Red"
seta g_blueteam "Blue"

// saber only; force powers allowed so the page can join players straight
// in (see web/main.js), but the free pack has no force power effects yet
seta g_maxForceRank 200
seta g_weaponDisable 65531

// the game code from the free pack (vm/jk2mpgame.qvm)
seta vm_game 2
seta sv_allowDownload 0
seta sv_pure 0
// bots: players add and remove them from the in-game menu, up to
// g_openBots (patches/mvsdk.patch); skill from 1 (easiest) to 5
seta bot_enable 1
seta bot_minplayers 0
seta g_openBots 3
seta g_spSkill 3

map open_dojo
