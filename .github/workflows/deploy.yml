# Builds everything (build.sh) on every push to main, deploys the game server
# to its machine, then the static site, build/site/, to Vercel: the server
# first, because the page and the server must have the same pack, and every
# build makes a new one. Vercel can't build the repository itself (it has no
# Emscripten, q3map2 or the pack generator), so vercel.json turns off its own
# builds. In the repository's settings (see "Deploying" in README.md):
#   - the secrets SERVER_SSH_KEY and SERVER_KNOWN_HOSTS and the variable
#     SERVER_HOST: the game server's machine, where the key can only run
#     opendojo-deploy (server/deploy.sh); until they're set, the server
#     isn't deployed
#   - the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID; until
#     they're set, the site isn't deployed
#   - the variable OPENDOJO_SERVER, the game server (host:port), and
#     optionally OPENDOJO_RELAY (wss://…/relay, by default
#     wss://<host>/relay); until it's set, the page says it has no server
# The page's source link points at this repository at the deployed commit.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: main

# one at a time, in order: a deploy stopped halfway could leave the server
# and the page with different packs
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # q3map2's libraries
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential clang-19 cmake pkg-config \
          libglib2.0-dev libxml2-dev libpng-dev libjpeg-turbo8-dev libassimp-dev libminizip-dev zlib1g-dev

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Emscripten
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
        "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10

    # clang 19, as on macOS: GCC 13 rejects q3map2's vector initializers,
    # clang 18 its C++20 alias template deduction
    - name: Build
      run: |
        . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        set -- --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
        if [ -n "$OPENDOJO_SERVER" ]; then set -- "$@" --server "$OPENDOJO_SERVER"; fi
        if [ -n "$OPENDOJO_RELAY" ]; then set -- "$@" --relay "$OPENDOJO_RELAY"; fi
        ./build.sh "$@"
      env:
        OPENDOJO_SERVER: ${{ vars.OPENDOJO_SERVER }}
        OPENDOJO_RELAY: ${{ vars.OPENDOJO_RELAY }}
        CC: clang-19
        CXX: clang++-19

    - uses: actions/upload-artifact@v4
      with:
        name: site
        path: build/site

  # the dedicated server for the game server's machine, an arm64 one, built
  # here so that the machine compiles nothing
  server:
    name: Build the game server (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build
      run: ./build-engine.sh ded

    - uses: actions/upload-artifact@v4
      with:
        name: jk2mvded
        path: build/native/out/Release/jk2mvded

  deploy-server:
    name: Deploy the game server
    needs: [build, server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      HOST: ${{ vars.SERVER_HOST }}
    steps:
    - uses: actions/checkout@v4
      if: env.HOST != ''

    - uses: actions/download-artifact@v4
      if: env.HOST != ''
      with:
        path: artifacts

    # what server/deploy.sh expects: the server's files, the built jk2mvded
    # and base/ with the site's pack
    - name: Deploy
      if: env.HOST != ''
      run: |
        mkdir -p bundle/base
        cp server/compose.yaml server/Dockerfile server/relay.mjs package.json package-lock.json bundle/
        install -m 755 artifacts/jk2mvded/jk2mvded bundle/jk2mvded
        cp server/server.cfg artifacts/site/base/opendojo.pk3 bundle/base/
        install -m 600 /dev/null ~/deploy_key
        printf '%s\n' "$SSH_KEY" > ~/deploy_key
        printf '%s\n' "$KNOWN_HOSTS" > ~/known_hosts
        tar -C bundle -c . | ssh -i ~/deploy_key -o IdentitiesOnly=yes \
          -o UserKnownHostsFile=~/known_hosts -o StrictHostKeyChecking=yes "deploy@$HOST"

  deploy:
    name: Deploy to Vercel
    needs: [build, deploy-server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
    - uses: actions/download-artifact@v4
      if: env.VERCEL_TOKEN != ''
      with:
        name: site
        path: site

    - name: Deploy
      if: env.VERCEL_TOKEN != ''
      run: npx --yes vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"
