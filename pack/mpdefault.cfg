// Default settings of the open asset pack, written for it. The engine runs
// this first (it won't start without it); the player's own settings come
// after, from jk2mpconfig.cfg in their home.

unbindall

// moving
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind LEFTARROW "+left"
bind RIGHTARROW "+right"
bind SPACE "+moveup"
bind c "+movedown"
bind CTRL "+movedown"
bind SHIFT "+speed"
bind e "+use"

// fighting
bind MOUSE1 "+attack"
bind MOUSE2 "+altattack"
bind MOUSE3 "saberAttackCycle"
bind l "saberAttackCycle"
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind q "force_throw"
bind f "force_pull"
bind r "force_speed"
bind g "+force_grip"
bind x "+force_lightning"
bind z "force_heal"
bind v "force_distract"
bind b "force_absorb"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"

// talking, the scoreboard
bind t "messagemode"
bind y "messagemode2"
bind TAB "+scores"
bind h "bow"
bind F1 "vote yes"
bind F2 "vote no"
bind F12 "screenshot"
bind PAUSE "pause"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind p "cg_thirdperson !"

// view
seta sensitivity "5"
seta cl_mouseAccel "0"
seta m_pitch "0.022"
seta m_yaw "0.022"
seta cg_fov "80"
seta cg_thirdPerson "1"
seta cg_drawCrosshair "1"
seta cg_drawFPS "0"
// the simple HUD: health, armor, saber style and force as text
seta cg_hudFiles "1"

// player
seta name "Player"
seta model "open/default"
seta color "4"
seta handicap "100"
seta sex "male"
// Force setup (no Force menu in this pack): the game's own fallback, with
// saber offense 3, so all three stances can be used
seta forcepowers "7-1-032330000000001333"

// rendering
seta r_picmip "0"
seta r_texturebits "32"
seta r_colorbits "32"
seta r_depthbits "24"
seta r_dynamiclight "1"
seta r_flares "0"
seta r_gamma "1"

// sound
seta s_volume "0.6"
seta s_musicvolume "0"

// network
seta rate "25000"
seta snaps "40"
seta cl_maxpackets "60"
